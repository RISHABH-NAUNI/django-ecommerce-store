{% extends 'base.html' %}

{% block content %}
<h3 class="fw-bold mb-4">Checkout</h3>
<form method="POST" action="{% url 'shop:checkout' %}">
    {% csrf_token %}
    <div class="row g-4">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold mb-3">Shipping & Payment</h5>
                <div class="mb-3">
                    <label class="form-label fw-bold">Shipping Address</label>
                    <textarea name="shipping_address" class="form-control" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Payment Method</label>
                    <select name="payment_method" class="form-select">
                        <option value="COD">Cash on Delivery</option>
                        <option value="RAZORPAY">Online Payment (Razorpay)</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold mb-3">Total Amount</h5>
                <!-- Replaced $ with ₹ -->
                <h3 class="text-primary fw-bold mb-4">₹{{ cart.get_total_price }}</h3>
                <button type="submit" class="btn btn-success btn-lg rounded-pill w-100">Place Order</button>
            </div>
        </div>
    </div>
</form>
{% endblock %}
